<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데스커 벽고정 확인</title>
<meta name="description" content="설치할 상품을 골라 담으면 벽고정 필수 여부를 바로 확인할 수 있어요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E9EBE6; --surface:#F8F9F6; --ink:#1D2422; --muted:#5E6763; --line:#CBD0C9;
  --must:#B8321C; --must-bg:#F7DFD9; --rec:#875800; --rec-bg:#F6E8C6; --ok:#2F6247; --ok-bg:#DCEBE1;
  --focus:#2C5E8A; --sel:#1D2422; --sel-ink:#F8F9F6;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#151918; --surface:#1E2321; --ink:#E7ECE9; --muted:#9BA4A0; --line:#353C39;
    --must:#FF8D78; --must-bg:#3B1F19; --rec:#F0C162; --rec-bg:#352B14; --ok:#8FD2AD; --ok-bg:#173026;
    --focus:#8DBDE6; --sel:#E7ECE9; --sel-ink:#151918; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --wall:#151918; --surface:#1E2321; --ink:#E7ECE9; --muted:#9BA4A0; --line:#353C39;
  --must:#FF8D78; --must-bg:#3B1F19; --rec:#F0C162; --rec-bg:#352B14; --ok:#8FD2AD; --ok-bg:#173026;
  --focus:#8DBDE6; --sel:#E7ECE9; --sel-ink:#151918; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--wall); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:680px; margin:0 auto; padding:28px 20px 120px}
header h1{font-size:1.75rem; line-height:1.25; margin:0 0 6px; font-weight:700; letter-spacing:-.01em}
header p{margin:0; color:var(--muted); font-size:.9375rem}

.tabs{display:flex; gap:6px; margin:24px -20px 0; padding:0 20px 2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none; font:inherit; font-size:.9375rem; font-weight:500; padding:8px 16px; border-radius:999px;
  border:1.5px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sel); color:var(--sel-ink); border-color:var(--sel)}
.legend{margin:14px 0 0; font-size:.8125rem; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:6px}
.pin{width:7px; height:7px; border-radius:50%; background:var(--must); display:inline-block; flex:none}

.picker{margin-top:14px; display:grid; gap:12px}
.tabnote{margin:0; font-size:.875rem; color:var(--muted)}
.group{background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:16px}
.group h2{margin:0; font-size:1.0625rem; line-height:1.4}
.group .sub{margin:2px 0 0; font-size:.8125rem; color:var(--muted)}
.row{display:grid; grid-template-columns:7.5em 1fr; gap:6px 12px; align-items:start; margin-top:12px}
.row-label{font-size:.875rem; color:var(--muted); padding-top:7px}
.row.solo{grid-template-columns:1fr}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-size:.9375rem; display:inline-flex; align-items:center; gap:7px; padding:6px 12px;
  border-radius:8px; border:1.5px solid var(--line); background:var(--wall); color:var(--ink); cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sel); color:var(--sel-ink); border-color:var(--sel)}
.chip .n{font-size:.75rem; font-weight:700}

.search label{display:block; font-weight:500; margin-bottom:6px}
.search input{width:100%; font:inherit; font-size:1.0625rem; padding:12px 14px; border:1.5px solid var(--line);
  border-radius:10px; background:var(--surface); color:var(--ink)}
.search input:focus{outline:none; border-color:var(--focus)}
.results{list-style:none; margin:8px 0 0; padding:0; background:var(--surface); border:1.5px solid var(--line); border-radius:10px}
.results[hidden]{display:none}
.results li+li{border-top:1px solid var(--line)}
.results button{display:flex; gap:12px; justify-content:space-between; width:100%; text-align:left; font:inherit;
  color:inherit; background:none; border:0; padding:12px 14px; cursor:pointer}
.results .empty{padding:14px; color:var(--muted); font-size:.9375rem}
.add{flex:none; font-size:.8125rem; color:var(--focus); font-weight:500}

#result{scroll-margin-top:16px}
.verdict{margin-top:40px; padding:22px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line)}
.verdict.must{background:var(--must-bg); border-color:transparent}
.verdict.rec{background:var(--rec-bg); border-color:transparent}
.verdict.ok{background:var(--ok-bg); border-color:transparent}
.verdict h2{margin:0; font-size:1.375rem; line-height:1.35}
.verdict.must h2{color:var(--must)} .verdict.rec h2{color:var(--rec)} .verdict.ok h2{color:var(--ok)}
.verdict p{margin:6px 0 0; font-size:.9375rem}
.cart-head{display:flex; justify-content:space-between; align-items:baseline; margin:24px 0 10px}
.cart-head h3{margin:0; font-size:1rem}
.clear{font:inherit; font-size:.875rem; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer; padding:4px}
.cart{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.item{background:var(--surface); border:1.5px solid var(--line); border-left-width:6px; border-radius:10px; padding:14px 14px 14px 16px}
.item.must{border-left-color:var(--must)} .item.rec{border-left-color:var(--rec)} .item.ok{border-left-color:var(--ok)}
.item-top{display:flex; gap:12px; justify-content:space-between; align-items:flex-start}
.item-name{font-weight:500; line-height:1.45}
.codes{display:block; color:var(--muted); font-size:.8125rem; margin-top:2px}
.badge{display:inline-block; font-size:.8125rem; font-weight:700; padding:2px 9px; border-radius:999px; margin-top:8px}
.must .badge{background:var(--must-bg); color:var(--must)}
.rec .badge{background:var(--rec-bg); color:var(--rec)}
.ok .badge{background:var(--ok-bg); color:var(--ok)}
.note{margin:6px 0 0; font-size:.875rem; color:var(--muted)}
.note strong{color:var(--ink); font-weight:500}
.qty{display:flex; align-items:center; gap:2px; flex:none}
.qty button{width:32px; height:32px; font:inherit; font-size:1.125rem; line-height:1; border:1.5px solid var(--line);
  background:var(--wall); color:var(--ink); border-radius:8px; cursor:pointer}
.qty span{min-width:26px; text-align:center; font-weight:500}

footer{margin-top:40px; color:var(--muted); font-size:.8125rem; line-height:1.7}
footer p{margin:0 0 6px}

.bar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1.5px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar-text{font-size:.9375rem; line-height:1.4}
.bar-text b{display:block; font-size:1rem}
.bar-text.must b{color:var(--must)} .bar-text.rec b{color:var(--rec)} .bar-text.ok b{color:var(--ok)}
.bar button{flex:none; font:inherit; font-weight:700; padding:10px 18px; border-radius:10px; border:0;
  background:var(--sel); color:var(--sel-ink); cursor:pointer}
.bar button:disabled{opacity:.4; cursor:default}
button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
@media (max-width:480px){
  header h1{font-size:1.5rem} .wrap{padding:22px 16px 120px} .tabs{margin:20px -16px 0; padding:0 16px 2px}
  .row{grid-template-columns:1fr} .row-label{padding-top:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>데스커 벽고정 확인</h1>
    <p>함께 설치할 상품을 모두 골라 담으면 벽고정이 필요한지 알려드려요. 2026년 10월 개정 기준이에요.</p>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="legend"><span><i class="pin"></i>단독 설치 시 벽고정 필수</span></div>
  <div class="picker" id="picker"></div>

  <section id="result">
    <div class="verdict" id="verdict" aria-live="polite"></div>
    <div class="cart-head" id="cartHead" hidden>
      <h3>담은 상품</h3>
      <button class="clear" id="clear" type="button">모두 비우기</button>
    </div>
    <ul class="cart" id="cart"></ul>
  </section>

  <footer>
    <p>참고용 안내예요. 실제 설치 가능 여부는 벽 상태와 설치 환경에 따라 달라질 수 있으니 시공 전 꼭 다시 확인해 주세요.</p>
    <p>“연결 설치 시 권장”은 함께 담은 상품을 서로 붙여 연결해서 설치할 때만 해당돼요. 따로 떨어뜨려 설치하면 벽고정 필수예요.</p>
  </footer>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="bar-text" id="barText"></div>
    <button type="button" id="barBtn">결과 보기</button>
  </div>
</div>

const PRODUCTS = RAW.map(([name, model, cj, req, rule], id) => {
  const p = {id, name, model, cj, required: req==='Y', rule};
  if (name.includes('옷장')) p.kind = 'wardrobe';
  else if (name.includes('책상세트')) { p.kind = 'desk'; p.motion = name.includes('모션'); }
  else {
    p.kind = 'shelf';
    p.line = name.includes('거울') ? 'mirror' : name.includes('깊은') ? 'deep' : name.includes('서랍형') ? 'drawer' : 'basic';
    p.upper = name.includes('상하부도어') || name.includes('상부도어형');
  }
  const m = name.match(/(\d{3,4})폭 (\d)단/);
  p.width = Number(m[1]);
  p.chip = (p.kind==='desk') ? `${m[1]}폭 ${m[2]}단` : `${m[2]}단`;
  p.hidden = name.includes('+링고') || name.includes('패키지');
  p.search = (name + ' ' + model).toLowerCase().replace(/\s+/g,'');
  return p;
});

const KEY = 'desker-wall-cart-v1';
let cart = [];
try { cart = JSON.parse(localStorage.getItem(KEY) || '[]').filter(c => PRODUCTS[c.id] && !PRODUCTS[c.id].hidden && c.qty > 0); } catch(e) { cart = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch(e) {} }
let tab = 'desk';

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const codeLine = p => p.model ? '제품코드 ' + p.model : '제품코드 없음';
const qtyOf = id => (cart.find(c => c.id === id) || {}).qty || 0;

function evaluate(entry){
  const p = PRODUCTS[entry.id];
  if (!p.required) return {status:'ok'};
  const tests = RULES[p.rule].tests;
  const partners = cart.filter(c => (c.id !== entry.id || c.qty > 1) && tests.some(t => TESTS[t](PRODUCTS[c.id])));
  return partners.length ? {status:'rec', partners} : {status:'must'};
}

function renderTabs(){
  const nav = $('#tabs'); nav.innerHTML = '';
  CATALOG.forEach(c => {
    const b = el('button', null, c.label); b.type = 'button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(c.key === tab));
    b.addEventListener('click', () => { tab = c.key; renderTabs(); renderPicker(); });
    nav.append(b);
  });
}

function chip(id){
  const p = PRODUCTS[id], q = qtyOf(id);
  const b = el('button','chip'); b.type = 'button';
  b.setAttribute('aria-pressed', String(q > 0));
  b.setAttribute('aria-label', p.name + (p.required ? ', 단독 설치 시 벽고정 필수' : '') + (q ? ', 담김' : ''));
  if (p.required) b.append(el('i','pin'));
  b.append(document.createTextNode(p.chip));
  if (q > 1) b.append(el('span','n','×' + q));
  b.addEventListener('click', () => toggle(id));
  return b;
}

function renderPicker(){
  const box = $('#picker'); box.innerHTML = '';
  const cat = CATALOG.find(c => c.key === tab);
  if (cat.key === 'search') { renderSearch(box); return; }
  if (cat.note) box.append(el('p','tabnote',cat.note));
  cat.groups.forEach(g => {
    const card = el('div','group');
    card.append(el('h2', null, g.t));
    if (g.sub) card.append(el('p','sub',g.sub));
    g.rows.forEach(([label, ids]) => {
      const row = el('div', 'row' + (label ? '' : ' solo'));
      if (label) row.append(el('div','row-label',label));
      const chips = el('div','chips'); ids.forEach(id => chips.append(chip(id)));
      row.append(chips); card.append(row);
    });
    box.append(card);
  });
}

let query = '';
function renderSearch(box){
  const wrap = el('div','search');
  const lab = el('label', null, '제품코드 또는 상품명'); lab.htmlFor = 'q';
  const input = el('input'); input.id = 'q'; input.type = 'search'; input.autocomplete = 'off'; input.value = query;
  input.placeholder = '예: DSDEA1402J, 서랍형 책장';
  const list = el('ul','results');
  const draw = () => {
    list.innerHTML = '';
    const raw = query.trim().toLowerCase();
    if (!raw) { list.hidden = true; return; }
    list.hidden = false;
    const tokens = raw.split(/\s+/);
    const hits = PRODUCTS.filter(p => !p.hidden && tokens.every(t => p.search.includes(t))).slice(0, 40);
    if (!hits.length) { list.append(el('li','empty','찾는 상품이 없어요. 위 탭에서 종류별로 골라 보세요.')); return; }
    hits.forEach(p => {
      const li = el('li'), b = el('button'); b.type = 'button';
      const left = el('span');
      left.append(el('span','item-name',p.name), el('span','codes', codeLine(p) + (p.required ? ', 단독 설치 시 벽고정 필수' : ', 벽고정 필수 아님')));
      b.append(left, el('span','add', qtyOf(p.id) ? '하나 더 담기' : '담기'));
      b.addEventListener('click', () => { addOne(p.id); draw(); });
      li.append(b); list.append(li);
    });
  };
  input.addEventListener('input', () => { query = input.value; draw(); });
  wrap.append(lab, input, list); box.append(wrap); draw();
}

function toggle(id){
  if (qtyOf(id)) cart = cart.filter(c => c.id !== id); else cart.push({id, qty:1});
  save(); renderAll();
}
function addOne(id){
  const f = cart.find(c => c.id === id); if (f) f.qty++; else cart.push({id, qty:1});
  save(); renderResult(); renderBar();
}
function changeQty(id, d){
  const c = cart.find(x => x.id === id); if (!c) return;
  c.qty += d; if (c.qty <= 0) cart = cart.filter(x => x.id !== id);
  save(); renderAll();
}

function summary(){
  const res = cart.map(c => ({c, p:PRODUCTS[c.id], r:evaluate(c)}));
  return {res, must:res.filter(x => x.r.status==='must').length, rec:res.filter(x => x.r.status==='rec').length};
}

function renderResult(){
  const v = $('#verdict'), list = $('#cart');
  list.innerHTML = ''; v.className = 'verdict'; v.innerHTML = '';
  $('#cartHead').hidden = !cart.length;
  if (!cart.length) {
    v.append(el('h2', null, '담은 상품이 없어요'), el('p', null, '위에서 함께 설치할 상품을 모두 골라 주세요. 같이 담은 상품에 따라 결과가 달라질 수 있어요.'));
    return;
  }
  const {res, must, rec} = summary();
  if (must) {
    v.classList.add('must');
    v.append(el('h2', null, `벽고정 필수 상품이 ${must}개 있어요`), el('p', null, rec ? '함께 연결해서 설치하면 권장으로 바뀌는 상품도 있으니 아래에서 확인해 주세요.' : '설치할 벽이 벽고정을 할 수 있는 벽인지 미리 확인해 주세요.'));
  } else if (rec) {
    v.classList.add('rec');
    v.append(el('h2', null, '연결해서 설치하면 벽고정은 권장이에요'), el('p', null, '따로 떨어뜨려 설치하면 벽고정 필수로 바뀌니 설치 방식을 꼭 확인해 주세요.'));
  } else {
    v.classList.add('ok');
    v.append(el('h2', null, '벽고정 필수 상품이 없어요'), el('p', null, '담은 상품은 모두 단독으로 설치해도 벽고정이 필수가 아니에요.'));
  }
  res.forEach(({c, p, r}) => {
    const li = el('li', 'item ' + r.status);
    const top = el('div','item-top'), info = el('div');
    info.append(el('div','item-name',p.name), el('span','codes',codeLine(p)));
    info.append(el('span','badge',{must:'벽고정 필수', rec:'연결 설치 시 권장', ok:'벽고정 필수 아님'}[r.status]));
    if (r.status === 'rec') {
      const names = [...new Set(r.partners.map(x => x.id === c.id ? '같은 상품 1개 더' : PRODUCTS[x.id].name))];
      const n = el('p','note');
      n.append(document.createTextNode('함께 담은 '), el('strong', null, names.join(', ')), document.createTextNode('와 붙여서 연결 설치하면 권장, 따로 설치하면 필수예요.'));
      info.append(n);
    } else if (r.status === 'must') {
      info.append(el('p','note','이 상품과 연결 설치하면 권장으로 바뀌어요: ' + RULES[p.rule].text));
    }
    const q = el('div','qty');
    const minus = el('button', null, '−'); minus.type='button'; minus.setAttribute('aria-label', p.name + ' 하나 빼기');
    const plus = el('button', null, '+'); plus.type='button'; plus.setAttribute('aria-label', p.name + ' 하나 더 담기');
    minus.addEventListener('click', () => changeQty(c.id, -1));
    plus.addEventListener('click', () => changeQty(c.id, 1));
    q.append(minus, el('span', null, String(c.qty)), plus);
    top.append(info, q); li.append(top); list.append(li);
  });
}

function renderBar(){
  const t = $('#barText'); t.className = 'bar-text'; t.innerHTML = '';
  const btn = $('#barBtn');
  if (!cart.length) { t.append(el('b', null, '상품을 골라 담아 주세요')); btn.disabled = true; return; }
  btn.disabled = false;
  const {must, rec} = summary();
  const n = cart.reduce((s,c) => s + c.qty, 0);
  if (must) { t.classList.add('must'); t.append(el('b', null, `벽고정 필수 ${must}개`)); }
  else if (rec) { t.classList.add('rec'); t.append(el('b', null, '연결 설치 시 권장')); }
  else { t.classList.add('ok'); t.append(el('b', null, '벽고정 필수 없음')); }
  t.append(document.createTextNode(`담은 상품 ${n}개`));
}

function renderAll(){ renderPicker(); renderResult(); renderBar(); }
$('#barBtn').addEventListener('click', () => $('#result').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}));
$('#clear').addEventListener('click', () => { cart = []; save(); renderAll(); });
renderTabs(); renderAll();
</script>
</body>
</html>
